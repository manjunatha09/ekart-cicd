apiVersion: v1
kind: Service
metadata:
  name: ekart
  labels:
    app: ekart
spec:
  type: NodePort
  selector:
    app: ekart
  ports:
    - port: 8070
      targetPort: 8070
      # Falls inside the 30000-33000 range opened in the Kubernetes
      # Security Group (terraform/infrastructure/security_groups.tf).
      # This exact value (30070) is also hard-coded as the target port in
      # terraform/infrastructure/loadbalancer.tf's target group — the AWS
      # Network Load Balancer forwards to whichever worker(s) have a pod,
      # via this NodePort. If you change it here, update loadbalancer.tf
      # too.
      nodePort: 30070
      protocol: TCP
