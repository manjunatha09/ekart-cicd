apiVersion: apps/v1
kind: Deployment
metadata:
  name: ekart
  labels:
    app: ekart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ekart
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ekart
    spec:
      containers:
        - name: ekart
          # Jenkins is the ONLY thing that edits this line. It rewrites the
          # tag to the current Jenkins BUILD_NUMBER and commits the change,
          # which is what Argo CD then detects and syncs.
          image: manja098/ekart:1
          ports:
            - containerPort: 8070
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8070
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8070
            initialDelaySeconds: 30
            periodSeconds: 20
